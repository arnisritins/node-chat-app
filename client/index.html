<!DOCTYPE html>
<html lang="en">  
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chat App</title>
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="status">
                <p>Users Online: <span id="users-online"></span></p>
                <p>Status: <span id="status" class="connecting">Connecting...</span></p>
            </div>
            <div class="profile">
                <div id="user-profile">
                    <p>Welcome <strong id="user-name"></strong>! Enjoy our chat room!</p>
                    <p><a href="#" id="leave-btn">&laquo; Leave</a></p>
                </div>
                <form id="user-form">
                    <input type="text" id="join-name" autocomplete="off" placeholder="User Name..." maxlength="20" required />
                    <button id="join-btn">Join</button>
                </form>
            </div>
        </header>

        <section class="messages" id="messages"></section>

        <footer class="message-form">
            <textarea name="message" id="chat-input" maxlength="200" placeholder="Type your message..."></textarea>
        </footer>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/main.js"></script>
</body>
</html>
